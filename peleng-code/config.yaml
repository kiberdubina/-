active: truck_detector
predict_s: 0.25
board:
  squares_x: 5
  squares_y: 7
  square_m: 0.04
  marker_m: 0.03
patterns:
  green_ball:
    s_min: 400.0
    s_max: 90000.0
    u_min: 15.0
    u_max: 4000.0
    r_min: 0.02
    r_max: 8.0
    v_min: 0.02
    v_max: 5.0
    d_m: null
    color:
      h_min: 25
      h_max: 100
      s_min: 80
      v_min: 40
  aircraft:
    s_min: 80.0
    s_max: 8000.0
    u_min: 5.0
    u_max: 4000.0
    r_min: 0.02
    r_max: 8.0
    v_min: 0.02
    v_max: 8.0
    d_m: null
    color: null
    moving_camera: true
  sky_uav:
    s_min: 8.0
    s_max: 1200.0
    u_min: 0.5
    u_max: 8000.0
    r_min: 0.02
    r_max: 8.0
    v_min: 0.01
    v_max: 80.0
    d_m: null
    color: null
    moving_camera: false
    require_motion: false
    mode: sky_dark
  white_drone:
    s_min: 120.0
    s_max: 5000.0
    u_min: 0.5
    u_max: 6000.0
    r_min: 0.02
    r_max: 8.0
    v_min: 0.01
    v_max: 8.0
    d_m: null
    color: null
    moving_camera: false
    require_motion: false
    mode: white_blob
  custom:
    s_min: 200
    s_max: 20000
    u_min: 15
    u_max: 4000
    r_min: 0.2
    r_max: 8
    v_min: 0.05
    v_max: 5
    d_m: null
    color: null
  motion:
    s_min: 400.0
    s_max: 90000.0
    u_min: 15.0
    u_max: 4000.0
    r_min: 0.02
    r_max: 8.0
    v_min: 0.02
    v_max: 5.0
    d_m: null
    color: null
    moving_camera: false
    require_motion: false
  black_shirt:
    s_min: 600
    s_max: 80000
    u_min: 8
    u_max: 4000
    r_min: 0.02
    r_max: 8
    v_min: 0.02
    v_max: 5
    d_m: null
    color:
      h_min: 0
      h_max: 180
      s_min: 0
      s_max: 100
      v_min: 0
      v_max: 55
    require_motion: true
    moving_camera: false
  # Дальняя трасса Way1: r_* — дальность от ближайшей камеры, не от нуля мира.
  way1:
    s_min: 40.0
    s_max: 120000.0
    u_min: 1.0
    u_max: 8000.0
    r_min: 1.0
    r_max: 600.0
    v_min: 0.05
    v_max: 120.0
    d_m: null
    color: null
    moving_camera: false
    require_motion: false
    # Цель — фура (SM_AA_track). Ящик относительно задней оси на земле:
    # вперёд, влево, вверх, метры. anchor_m — опорная точка (pivot) 3D-модели,
    # её координаты даёт таблица object_transform_SM_AA_track. Габарит и pivot
    # определены подгонкой ящика к силуэтам камер 1–4 (см. docs/защита.md).
    vehicle:
      front_m: 14.12
      rear_m: -5.54
      width_m: 5.13
      height_m: 6.43
      anchor_m: [15.43, -0.11, 3.01]
      # Детектор грузовика: пятна фона + рамки детектора. YOLO-World с вшитыми запросами
      # (как у truck_detector), не привязан к одной сцене. Контрольный прогон Way1:
      # дообученная truck_way1_all.pt — RMSE 2,84 м, truck_world.pt — 2,18 м.
      # Нет файла весов — только фон.
      detector: models/truck_world.pt
      detector_mode: both
  # Way2 (папка scene2): тот же грузовик CargoTruck.fbx (габарит как у way1), снег и пыль.
  # Пятна фона там ловят снежинки — только рамки детектора. truck_world_top.pt — YOLO-World x
  # с запросами «грузовик сверху» (собирается _make_truck_world_top.py): видит и дрон cam-2.
  # Опорная точка — центр ящика на земле.
  way2:
    s_min: 40.0
    s_max: 120000.0
    u_min: 1.0
    u_max: 8000.0
    r_min: 1.0
    r_max: 600.0
    v_min: 0.05
    v_max: 120.0
    d_m: null
    color: null
    moving_camera: false
    require_motion: false
    vehicle:
      front_m: 14.12
      rear_m: -5.54
      width_m: 5.13
      height_m: 6.43
      anchor_m: [4.29, 0.0, 0.0]
      detector: models/truck_world_top.pt
      detector_mode: detector
  # Цель по описанию (app/object_detector.py, нужен requirements-detect.txt и веса в models/).
  # s_*/u_*/r_*/v_* можно не задавать: отбор делает модель. Площадь — площадь рамки.
  black_hoodie_person:
    mode: object
    class: person
    conf: 0.4
    region: upper
    color: {h_min: 0, h_max: 180, s_min: 0, s_max: 255, v_min: 0, v_max: 60}
    color_share: 0.35
  red_car:
    mode: object
    class: car
    conf: 0.4
    region: full
    color:
      - {h_min: 0, h_max: 10, s_min: 120, s_max: 255, v_min: 70, v_max: 255}
      - {h_min: 170, h_max: 180, s_min: 120, s_max: 255, v_min: 70, v_max: 255}
    color_share: 0.25
  truck_text:
    mode: text
    query: ["truck", "cargo truck"]
    conf: 0.25
  # Поток машин: детектор транспорта по всему кадру, Shift+клик в окне камеры — выбрать машину.
  traffic:
    mode: object
    class: [car, truck, bus, motorcycle]
    conf: 0.3
    det_every: 2
    det_width: 960
    roi_scale: 0
    r_min: 0.5
    r_max: 500.0
    v_max: 70.0
  # Грузовик на любом видео: YOLO-World (yolov8m-worldv2) с вшитыми запросами truck, cargo truck,
  # lorry, box truck — все названы truck, CLIP и сеть не нужны. Обычная YOLO и дообученные
  # truck_way1*.pt на других сценах (каньон, закат, плашки поверх видео) фуру теряют.
  # merge — кабина и прицеп в одну рамку. В 3D — тот же ящик, что у way1, пятна только от детектора.
  truck_detector:
    mode: object
    class: truck
    model: truck_world.pt
    conf: 0.15
    # Каждый кадр: через кадр центр отстаёт на ~10 px у быстрой фуры, на каждом — ~1 px.
    det_every: 1
    merge: true
    s_min: 40.0
    s_max: 100000000.0
    u_min: 1.0
    u_max: 8000.0
    r_min: 1.0
    r_max: 600.0
    v_min: 0.05
    v_max: 120.0
    d_m: null
    color: null
    moving_camera: false
    require_motion: false
    vehicle:
      front_m: 14.12
      rear_m: -5.54
      width_m: 5.13
      height_m: 6.43
      anchor_m: [15.43, -0.11, 3.01]
      detector: models/truck_world.pt
      detector_mode: detector
